# Machine-readable gates. Facts are from the OWNER'S AUDIT dated 2026-11-14 (not re-checked by the software).
# Editing this file is a decision by the owner; the code only reads it.
audit:
  source: owner's audit
  date: "2026-11-14"
  note: Statuses reflect what the owner recorded on that date. Review before relying on them.
gates:
  "data:fnspid":
    kind: data
    status: blocked
    licence: unresolved
    reason: Conflicting licence statements; upstream publisher terms unread.
    unlock: Written permission from the authors plus readable upstream publisher terms.
    who: owner
  "data:alpaca_benzinga":
    kind: data
    status: blocked
    licence: unresolved
    reason: Terms unread; a credential would be needed.
    unlock: Owner reads and records the terms, and decides on a credential outside this repository.
    who: owner
  "data:sec_edgar":
    kind: data
    status: not_adopted
    licence: not_assessed
    reason: Filings are not news; using them would change the research question.
    unlock: A new research question and pre-registration.
    who: owner and supervisor
  "data:gdelt":
    kind: data
    status: rejected
    licence: not_assessed
    reason: No ticker mapping or headline text.
    unlock: None planned.
    who: owner
  "data:user_import":
    kind: data
    status: allowed_with_licence_note
    licence: recorded_per_import
    reason: Bring-your-own CSV. Importing does NOT clear a licence; it only records the note supplied.
    unlock: Every import must carry a licence note and a source name.
    who: owner
  "data:synthetic":
    kind: data
    status: allowed
    licence: not_applicable
    reason: Generated by this project. Demo and software checks only.
    unlock: Not applicable.
    who: nobody
  "scorer:finbert_prosus":
    kind: scorer
    status: exploratory_only
    licence: verified_permitted
    licence_note: CC BY-NC-SA 4.0, non-commercial research.
    contamination: unresolved
    allowed_use: exploratory
    reason: Training-data dates unverified, so test-period overlap cannot be ruled out. Never confirmatory.
    unlock: Documented training-data cutoff that precedes the test period.
    who: owner
  "scorer:finbert_tone":
    kind: scorer
    status: blocked
    licence: unresolved
    contamination: unresolved
    allowed_use: blocked
    reason: Licence unresolved.
    unlock: A clear licence statement recorded by the owner.
    who: owner
  "scorer:lm_lexicon":
    kind: scorer
    status: exploratory_only
    licence: academic_use_free
    contamination: unresolved
    allowed_use: exploratory
    reason: Dictionary version not frozen before 2020.
    unlock: A dictionary version dated before the test period, supplied locally by the owner under its terms.
    who: owner
  "scorer:demo_lexicon":
    kind: scorer
    status: demo_only
    licence: not_applicable
    contamination: not_applicable
    allowed_use: synthetic_demo
    reason: Hand-written demo list; circular on synthetic headlines.
    unlock: Not applicable.
    who: nobody
  "scorer:mock_model":
    kind: scorer
    status: demo_only
    licence: not_applicable
    contamination: not_applicable
    allowed_use: synthetic_demo
    reason: Deterministic fake model. Not FinBERT.
    unlock: Not applicable.
    who: nobody
  "study:confirmatory":
    kind: study
    status: blocked
    reason: No licensed real data and no scorer with verified-clear contamination status.
    unlock: A permitted data licence, a verified-clear scorer, a frozen pre-registration and frozen samples.
    who: owner and supervisor
  "storage:real_data_and_weights":
    kind: storage
    status: blocked
    reason: No real data or model weights may be stored in this project.
    unlock: Owner decision after licences are resolved.
    who: owner
