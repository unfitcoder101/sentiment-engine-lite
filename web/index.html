<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment Engine Lite (synthetic demo)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--muted:#5d6b7c;--line:#d9dee6;--accent:#1f5fbf;--accent-ink:#fff;
--pos:#1a7f4b;--neg:#b3362b;--neu:#8a6d1a;--none:#6b7280;--warn-bg:#fff4d6;--warn-ink:#5b4300;--warn-line:#e2c56a}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e6eaf0;--muted:#9aa7b6;--line:#2f3a47;
--accent:#7fb0ff;--accent-ink:#0d1520;--pos:#5fcf95;--neg:#ff8a7d;--neu:#e0c060;--none:#9aa3af;--warn-bg:#3a2f0c;--warn-ink:#ffe7a3;--warn-line:#7a651f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#banner{position:sticky;top:0;z-index:5;background:var(--warn-bg);color:var(--warn-ink);border-bottom:2px solid var(--warn-line);
padding:8px 16px;font-weight:600;font-size:13.5px;text-align:center}
header,main{max-width:1180px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:16px 0 4px}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button,.btn{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected=true],.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid>*{min-width:0}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:6px}.scroll.tall{max-height:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
label{font-weight:600;margin-right:4px}.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
svg{display:block;width:100%;height:auto}svg text{fill:var(--muted);font-size:11px}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.bar{height:14px;border-radius:3px;min-width:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.verdict{font-weight:700;padding:8px 10px;border:2px solid var(--accent);border-radius:6px;margin:8px 0;overflow-wrap:anywhere}
.note{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:6px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;border:1px solid currentColor;font-size:12px;white-space:nowrap}
.b0{color:var(--pos)}.b1{color:var(--neg)}.b2{color:var(--neu)}.b3{color:var(--none)}
ul{margin:6px 0;padding-left:20px}details{margin-top:10px}summary{cursor:pointer;font-weight:600}
code{font-size:12.5px;overflow-wrap:anywhere}td code{white-space:nowrap}.hash{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;overflow-wrap:anywhere}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
@media (max-width:480px){.bar-row{grid-template-columns:118px 1fr 38px}th,td{padding:4px 6px}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:4px}}
</style>
</head>
<body>
<div id="banner" role="note">Educational research prototype. Data origin: SYNTHETIC. No evidence of predictive value. Not investment advice.</div>
<header>
<h1>Sentiment Engine Lite</h1>
<p class="muted small" id="meta">Loading data…</p>
<nav role="tablist" aria-label="Sections" id="tabs"></nav>
</header>
<main id="main" tabindex="-1"></main>
<script>
"use strict";
const TABS=[["overview","Overview"],["sentiment","Sentiment"],["headlines","Headlines"],["experiments","Experiments"],["cutoff","Cutoff cases"],
["models","Model comparison"],["features","Feature explanations"],["gates","Gates"],["tools","Method tools"],["method","Methodology and limitations"]];
const LEX=["positive","negative","neutral (zero-net)","no lexicon coverage"],MOD=["positive","negative","neutral"];
const BVAR=["--pos","--neg","--neu","--none"];
const NEEDS_API="This view needs the live API. Start it with: .venv/bin/python -m se.cli serve";
let MODE="static",BUNDLE=null,META=null,SYMS=[];
const cache={},state={tab:"overview",symbol:null,scorer:"mock_model",filter:"all",offset:0,date:null,assign:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f4=v=>v==null?"–":(v>=0?"+":"")+Number(v).toFixed(4);
const p4=v=>v==null?"–":Number(v).toFixed(4);
const yes=b=>b?"yes":"no";
const tag=(b,list)=>`<span class="tag b${(list||LEX).indexOf(b)<0?3:(list||LEX).indexOf(b)}">${esc(b)}</span>`;
function tbl(heads,rows,nums,cls){nums=nums||[];
  return `<div class="scroll ${cls||""}"><table><thead><tr>${heads.map((h,i)=>`<th${nums.includes(i)?' class="num"':""}>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td${nums.includes(i)?' class="num"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
const picker=(id,label,opts,val)=>`<span><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===val?" selected":""}>${esc(t)}</option>`;}).join("")}</select></span>`;

async function get(path){
  if(cache[path])return cache[path];
  let env;
  if(MODE==="api"){const r=await fetch("api"+path);env=await r.json();if(!r.ok)throw new Error(env.detail||env.error||("HTTP "+r.status));}
  else{env=BUNDLE[path];if(!env)throw new Error(NEEDS_API);}
  cache[path]=env.data;return env.data;
}
function renderTabs(){
  $("tabs").innerHTML=TABS.map(([id,label])=>`<button role="tab" id="tab-${id}" aria-selected="${state.tab===id}" aria-controls="main" data-tab="${id}">${label}</button>`).join("");
}
function show(tab){state.tab=tab;history.replaceState(null,"","#"+tab);renderTabs();render();}

/* ---------- Overview ---------- */
async function overview(){
  const m=META,g=(await get("/gates")).gates;
  const blocked=Object.entries(g).filter(([k,v])=>["blocked","rejected","not_adopted","exploratory_only"].includes(v.status));
  return `<div class="card"><h2>What this is</h2>
<p>A university prototype of a research pipeline for one question: <em>does news sentiment help rank stocks?</em> This version answers nothing about real markets. It checks that the software is wired correctly, using invented prices and invented headlines.</p>
<p>The check works like a lab control. Two fake worlds share the same random draws. In the <strong>null</strong> world, news has no link to prices. In the <strong>planted</strong> world, a small known link (beta = ${m.beta} per day) is inserted on purpose. A correct pipeline should flag the planted world and stay quiet in the null world. The rules for "flag" were written down and hashed before the run.</p>
<p class="note">${esc(m.lexicon_note)}</p>
<p class="small muted">Data source for this page: ${MODE==="api"?"live read-only API over the local SQLite database":"static file web/data.json (start the API for the interactive tools)"}.</p></div>
<div class="grid"><div class="card"><h2>Built and tested</h2><ul>
<li>Publication time to trading day (cutoff, weekends, holidays, date-only items)</li>
<li>De-duplication (48 hours) and multi-ticker weights</li>
<li>Execution-based labels and four sentiment features</li>
<li>Synthetic generator: ${m.n_symbols} fake tickers, ${m.n_days} trading days, ${m.n_articles} fake articles, seed ${m.seed}</li>
<li>Two demo scorers: a demo lexicon and a MOCK MODEL (not FinBERT)</li>
<li>Experiment framework: frozen samples, nine arms, two folds, block bootstrap, Holm correction, two placebos, ten-seed robustness</li>
<li>Pre-registration hashing, run modes and a confirmatory guard</li>
<li>SQLite storage, CSV importers, read-only API, this dashboard</li></ul></div>
<div class="card"><h2>Present as code only (never run on real inputs)</h2><ul>
<li>FinBERT, finbert-tone and Loughran-McDonald adapters: tested with fake files; no weights or dictionary included</li>
<li>CSV importers: tested on tiny hand-made files</li>
<li>Confirmatory mode: always refused under the current gates</li></ul>
<h3>Not built</h3><ul><li>Any pipeline over real or imported data</li><li>Any result about real markets</li></ul></div>
<div class="card"><h2>Blocked or limited, with reasons</h2><ul>
${blocked.map(([k,v])=>`<li><strong>${esc(k)}</strong> (${esc(v.status.replace(/_/g," "))}): ${esc(v.reason)}</li>`).join("")}</ul>
<p class="small muted">See the Gates tab for what would unlock each item.</p></div></div>`;
}

/* ---------- Sentiment ---------- */
function lineChart(dates,vals,counts){
  const W=720,H1=150,H2=70,L=38,R=8,n=dates.length,x=i=>L+(W-L-R)*i/Math.max(1,n-1);
  const amax=Math.max(0.05,...vals.map(v=>Math.abs(v||0))),y=v=>10+(H1-20)*(1-(v+amax)/(2*amax));
  let d="",pen=false;
  vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);pen=true;});
  const cmax=Math.max(1,...counts),bw=Math.max(0.8,(W-L-R)/n),top=H1+14;
  const bars=counts.map((c,i)=>c?`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(top+H2*(1-c/cmax)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H2*c/cmax).toFixed(1)}"/>`:"").join("");
  const ticks=[0,Math.floor(n/3),Math.floor(2*n/3),n-1].map(i=>`<text x="${x(i)}" y="${top+H2+14}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${dates[i]}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${top+H2+20}" role="img" aria-label="S5 sentiment line and daily article-count bars; values are in the table below">
<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
<text x="${L-4}" y="${y(amax)+4}" text-anchor="end">${amax.toFixed(2)}</text><text x="${L-4}" y="${y(0)+4}" text-anchor="end">0</text><text x="${L-4}" y="${y(-amax)+4}" text-anchor="end">-${amax.toFixed(2)}</text>
<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.4"/>
<text x="${L}" y="${top-2}">scored articles per day (max ${cmax})</text><g fill="var(--muted)">${bars}</g>${ticks}</svg>`;
}
const SC_OPTS=[["mock_model","MOCK MODEL (not FinBERT)"],["demo_lexicon","Demo lexicon (not Loughran-McDonald)"]];
async function sentiment(){
  const s=state.symbol,d=await get(`/sentiment/${s}?scorer=${state.scorer}`),keys=Object.keys(d.buckets);
  const tot=keys.reduce((a,k)=>a+d.buckets[k],0),bmax=Math.max(1,...keys.map(k=>d.buckets[k]));
  const rows=d.dates.map((x,i)=>[x,f4(d.S1[i]),f4(d.S5[i]),d.count[i]]);
  return `<div class="card"><div class="controls">${picker("sym","Synthetic ticker",SYMS,s)}${picker("scorer","Scorer",SC_OPTS,state.scorer)}</div>
<p class="muted small">Features come from fake headlines scored by <strong>${esc(d.scorer_label)}</strong>. Both worlds share the same news. S5 = weighted mean score over the last 5 trading days; a gap means no scored news in that window.</p>
<h3>S5 (line) and scored articles per day (bars)</h3>${lineChart(d.dates,d.S5,d.count)}
<details><summary>Data table for this chart (${d.dates.length} trading days)</summary>${tbl(["Trading day","S1","S5","Articles"],rows,[1,2,3])}</details></div>
<div class="card"><h2>${d.kind==="lexicon"?"Lexicon buckets":"Model labels"} for ${s}</h2>
${keys.map((k,i)=>`<div class="bar-row"><span>${esc(k)}</span><div><div class="bar" style="width:${100*d.buckets[k]/bmax}%;background:var(${BVAR[d.kind==="lexicon"?i:[0,1,2][i]]})"></div></div><span class="num">${d.buckets[k]}</span></div>`).join("")}
<p class="muted small">${d.kind==="lexicon"?"“No lexicon coverage” means no demo-list word was found. It is not treated as neutral and is left out of the lexicon features.":"These are the fake model's labels (largest output score). Output scores are not probabilities of any price move."}</p>
${tbl([d.kind==="lexicon"?"Bucket":"Label","Articles","Share"],keys.map(k=>[esc(k),d.buckets[k],(tot?(100*d.buckets[k]/tot).toFixed(1):"0.0")+"%"]),[1,2],"tall")}</div>`;
}

/* ---------- Headlines ---------- */
async function headlines(){
  const d=await get(`/sentiment/${state.symbol}/headlines?limit=40&offset=${state.offset}`);
  const fopts=[["all","all"]].concat(LEX.map(b=>["lex:"+b,"lexicon: "+b]),MOD.map(l=>["mod:"+l,"model label: "+l]));
  const list=d.items.filter(h=>state.filter==="all"||(state.filter.startsWith("lex:")?h.lexicon.bucket===state.filter.slice(4):h.model.label===state.filter.slice(4)));
  const rows=list.map(h=>[`${esc(h.headline)}<br><span class="muted">${esc(h.kind)}${h.kept?"":", not used"}</span>`,esc(h.utc==null?"(missing)":h.utc),esc(h.local||"–"),esc(h.assigned||"invalid"),esc(h.reason),
    `${tag(h.lexicon.bucket)}<br><span class="muted">${esc(h.lexicon.matched.join(", ")||"–")}</span>`,`${tag(h.model.label,MOD)}<br><span class="muted">x ${f4(h.model.x)}</span>`]);
  const last=d.offset+d.items.length;
  return `<div class="card"><div class="controls">${picker("sym","Synthetic ticker",SYMS,state.symbol)}${picker("flt","Filter",fopts,state.filter)}</div>
<p class="muted small">Showing ${list.length} of rows ${d.total?d.offset+1:0}–${last} (${d.total} for this ticker), newest assigned day first. Lexicon buckets and model labels are shown in separate columns and never merged. Neither is a probability.</p>
${tbl(["Headline (synthetic)","UTC","New York time","Assigned day","Reason","Lexicon bucket, matched words","MOCK MODEL label"],rows,[],"tall")}
<p class="controls" style="margin-top:10px"><button class="btn" id="prev"${d.offset===0?" disabled":""}>Previous</button><button class="btn" id="next"${(last>=d.total||MODE!=="api")?" disabled":""}>Next</button>
${MODE!=="api"?'<span class="muted small">Static file holds the first 40 rows per ticker; paging needs the live API.</span>':""}</p></div>`;
}

/* ---------- Experiments ---------- */
function forest(cs){
  const W=720,L=150,R=16,rowH=24,H=cs.length*rowH+30,lo=Math.min(0,...cs.map(c=>c.ci_low)),hi=Math.max(0,...cs.map(c=>c.ci_high)),pad=(hi-lo)*0.06||0.01;
  const x=v=>L+(W-L-R)*(v-(lo-pad))/((hi+pad)-(lo-pad));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Delta IC with unadjusted 95% intervals for each comparison; values are in the table below">
<line x1="${x(0)}" x2="${x(0)}" y1="4" y2="${H-22}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(0)}" y="${H-8}" text-anchor="middle">0</text>
<text x="${x(lo)}" y="${H-8}" text-anchor="middle">${lo.toFixed(3)}</text><text x="${x(hi)}" y="${H-8}" text-anchor="middle">${hi.toFixed(3)}</text>
${cs.map((c,i)=>{const y=14+i*rowH,col=c.p_holm!=null?"var(--accent)":"var(--muted)";return `<text x="4" y="${y+4}">${esc(c.name)}</text><line x1="${x(c.ci_low)}" x2="${x(c.ci_high)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><circle cx="${x(c.delta)}" cy="${y}" r="4" fill="${col}"/>`;}).join("")}</svg>`;
}
function strip(c2){
  const W=320,H=54,all=c2.deltas.concat([c2.observed,0]),lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*0.08||0.01;
  const x=v=>10+(W-20)*(v-(lo-pad))/((hi+pad)-(lo-pad));
  return `<svg style="max-width:460px" viewBox="0 0 ${W} ${H}" role="img" aria-label="20 shuffled-placebo delta IC values as dots, observed delta IC as a vertical line; values in the table below">
<line x1="10" x2="${W-10}" y1="28" y2="28" stroke="var(--line)"/><line x1="${x(0)}" x2="${x(0)}" y1="20" y2="36" stroke="var(--muted)"/><text x="${x(0)}" y="49" text-anchor="middle">0</text>
${c2.deltas.map(v=>`<circle cx="${x(v).toFixed(1)}" cy="28" r="3.5" fill="var(--muted)" fill-opacity=".65"/>`).join("")}
<line x1="${x(c2.observed)}" x2="${x(c2.observed)}" y1="8" y2="40" stroke="var(--accent)" stroke-width="3"/><text x="${x(c2.observed)}" y="49" text-anchor="${x(c2.observed)>W*0.75?"end":"middle"}" style="fill:var(--accent)">observed</text></svg>`;
}
const CRIT={"1_holm_p_C_vs_B":"1. Holm-adjusted p of C vs B ≤ 0.05","2_min_delta_ic":"2. Delta IC (C − B) ≥ 0.01","3_C_beats_C1_and_C_LM":"3. C beats C1 and C_LM (Holm p ≤ 0.05, positive deltas)","4_both_placebos_passed":"4. Both placebos passed","5_net_topk_C_not_lower_than_B":"5. Net-of-cost top-K of C not lower than B"};
function worldCard(r){
  const cs=r.comparisons.primary.concat(r.comparisons.exploratory),A=r.arms,names=Object.keys(A);
  const armRows=names.map(n=>{const a=A[n],P=a.P1||{},S=a.S2||{},y=a.by_year||{};return [`<div style="min-width:150px"><strong>${n}</strong><br><span class="muted">${esc(a.label)}</span></div>`,f4(a.ic),f4(y["2021"]),f4(y["2022"]),f4(P.ic_r),p4(P.auc),p4(P.precision_at_k),f4(P.net_topk),f4(S.ic_z)];});
  const cmpRows=cs.map(c=>[esc(c.name),esc(c.family),f4(c.delta),`${f4(c.ci_low)} to ${f4(c.ci_high)}`,p4(c.p),c.p_holm!=null?p4(c.p_holm):"not applicable"]);
  const s=r.samples,sens=r.sensitivity||{};
  return `<div class="card"><h2>${r.world==="null"?"Null world (no link planted)":`Planted world (beta = ${r.beta})`}</h2>
<p class="small muted">Run <code>${esc(r.run_id)}</code>, mode ${esc(r.mode)}, primary scorer ${esc(r.primary_scorer)}. Verdict text exactly as stored:</p>
<div class="verdict">${esc(r.verdict)}</div>
<h3>Success rule (fixed before the run)</h3>
${tbl(["Criterion","Met"],Object.entries(r.criteria).map(([k,v])=>[CRIT[k]||esc(k),yes(v)]),[],"tall")}
<h3>All arms (P1 sample)</h3>
${tbl(["Arm","Mean daily IC vs Z_exec","IC 2021","IC 2022","IC vs R_exec","AUC vs L_exec","Precision@K","Net top-K excess","IC on S2"],armRows,[1,2,3,4,5,6,7,8],"tall")}
<p class="small muted">IC = daily Spearman rank correlation, averaged over ${A.B.n_dates} dates (${A.B.n_rows} rows). K = top 10% per day; net = minus 0.004 cost and the day's median. S2 = rows with news. AUC 0.5 = no ranking ability.</p>
<h3>Delta IC with unadjusted 95% intervals</h3>${forest(cs)}
${tbl(["Comparison","Family","Delta IC","Unadjusted 95% interval","Raw p (one-sided)","Holm-adjusted p"],cmpRows,[2,3,4,5],"tall")}
<h3>Placebo C2: 20 within-date shuffles vs observed</h3>${strip(r.placebo.C2)}
<dl class="kv"><dt>C2 result</dt><dd>${r.placebo.C2.passed?"PASSED":"NOT PASSED"} (observed ${f4(r.placebo.C2.observed)}, max shuffle ${f4(r.placebo.C2.max)}, mean shuffle ${f4(r.placebo.C2.mean)}; needs observed ≥ max and mean &lt; 0.005)</dd>
<dt>C3 result (sentiment from 20 days earlier)</dt><dd>${r.placebo.C3.passed?"PASSED":"NOT PASSED"} (delta vs B ${f4(r.placebo.C3.delta)}, limit ${f4(r.placebo.C3.limit)}, raw p ${p4(r.placebo.C3.p)}; needs delta ≤ limit and p &gt; 0.10)</dd></dl>
<details><summary>C2 shuffle values table</summary>${tbl(["Shuffle seed","Delta IC vs B"],r.placebo.C2.deltas.map((v,i)=>[r.placebo.C2.seeds[i],f4(v)]).concat([["<strong>observed C</strong>",`<strong>${f4(r.placebo.C2.observed)}</strong>`]]),[1])}</details>
<h3>Ablations (exploratory)</h3>
${tbl(["Variant","Mean IC","Delta vs C","Unadjusted 95% interval","Delta vs B"],(r.ablations||[]).map(a=>[esc(a.name.replace(/_/g," ")),f4(a.ic),f4(a.delta),`${f4(a.ci_low)} to ${f4(a.ci_high)}`,f4(a.delta_vs_B)]),[1,2,3,4],"tall")}
<h3>Power and sensitivity</h3>
<dl class="kv"><dt>Bootstrap SE of delta IC (C − B)</dt><dd>${p4(r.power.bootstrap_se)}</dd><dt>Minimum detectable delta (approx.)</dt><dd>${p4(r.power.mde)}</dd>
<dt>Block length 10 (reported only)</dt><dd>p ${p4((sens.block_10||{}).p)}, interval ${f4((sens.block_10||{}).ci_low)} to ${f4((sens.block_10||{}).ci_high)}</dd>
<dt>Block length 40 (reported only)</dt><dd>p ${p4((sens.block_40||{}).p)}, interval ${f4((sens.block_40||{}).ci_low)} to ${f4((sens.block_40||{}).ci_high)}</dd></dl>
<p class="small muted">${esc(r.power.note)}</p>
<h3>Frozen samples and checks</h3>
${tbl(["Sample","Rows","SHA-256 of key list"],Object.keys(s.hashes).map(k=>[k,s.counts[k],`<span class="hash">${s.hashes[k]}</span>`]),[1],"tall")}
<dl class="kv"><dt>Abort checks run</dt><dd>${r.assertions.checked} across ${r.assertions.arms_checked} arms and shuffles, ${r.assertions.failed} failed</dd>

async function experiments(){
  const ex=await get("/experiments"),rs=await Promise.all(ex.runs.map(r=>get("/experiments/"+r.run_id))),rb=ex.robustness;
  const pct=v=>(100*v).toFixed(0)+"%";
  return `<p class="note"><strong>Software check on invented data, not evidence about markets.</strong> What a verdict does NOT mean: it does not say sentiment helps with real stocks, it does not estimate any real-world effect, and it is not a recommendation. The planted link was put there on purpose; finding it only shows the pipeline can see an effect that exists by construction. A "not detected" or "placebo not excluded" result is a legitimate outcome and is reported as produced.</p>
<div class="grid">${rs.map(r=>{const c=r.comparisons.primary[0];return `<div class="card"><h2>${r.world==="null"?"Null world":"Planted world"}: summary</h2><div class="verdict">${esc(r.verdict)}</div><dl class="kv"><dt>Delta IC (C − B)</dt><dd>${f4(c.delta)}</dd><dt>Unadjusted 95% interval</dt><dd>${f4(c.ci_low)} to ${f4(c.ci_high)}</dd><dt>Raw p / Holm-adjusted p</dt><dd>${p4(c.p)} / ${p4(c.p_holm)}</dd><dt>Placebos C2 / C3</dt><dd>${r.placebo.C2.passed?"passed":"not passed"} / ${r.placebo.C3.passed?"passed":"not passed"}</dd></dl></div>`;}).join("")}</div>${rs.map(worldCard).join("")}
<div class="card"><h2>Robustness: ten pre-declared seeds (1 to 10)</h2>
<dl class="kv"><dt>Null-world false-alarm rate</dt><dd>${pct(rb.null_false_alarm_rate)} (${rb.null_false_alarm_rate*10} of 10)</dd>
<dt>Planted-world detection rate</dt><dd>${pct(rb.planted_detection_rate)} (${Math.round(rb.planted_detection_rate*10)} of 10)</dd>
<dt>Planted world, all five criteria met</dt><dd>${pct(rb.planted_criteria_met_rate)}</dd></dl>
<p class="small muted">${esc(rb.definition)}</p>
${tbl(["Seed","World","Delta IC (C − B)","Raw p","Holm p","Flagged (criteria 1–2)","Placebos passed","Verdict as stored"],rb.rows.map(x=>[x.seed,x.world,f4(x.delta_ic),p4(x.p),p4(x.p_holm),yes(x.detected),yes(x.placebos_passed),esc(x.verdict)]),[2,3,4],"tall")}</div>
<div class="card small"><h2>How to read this</h2><p>B = model on price-only features. C = B plus sentiment features from the MOCK MODEL. C_LM = the same from the demo lexicon. C1 = B plus news volume only. C2 and C3 are placebos: sentiment shuffled across stocks, or taken from 20 days earlier. D = sentiment only. A arms are simple volatility rules. Models are refit in each of two folds (test years 2021 and 2022) with a purge and embargo gap. P-values come from a paired stationary bootstrap (mean block 20 days, 2000 resamples, fixed seed). Only three comparisons are Holm-adjusted; everything else is exploratory. Intervals are unadjusted. Model scores are ranking scores, not probabilities.</p></div>`;
}

/* ---------- Methodology ---------- */
async function method(){
  return `<div class="card"><h2>Methodology in plain words</h2><ol>
<li><strong>Timing.</strong> Each article gets one trading day. News at or before the cutoff (15:30 New York) counts for that day; later news, weekend news and date-only items count for the next trading day.</li>
<li><strong>Clean-up.</strong> Repeated headlines within 48 hours are dropped; an article about k stocks counts 1/k for each.</li>
<li><strong>Scoring.</strong> Each headline gets a tone score x from a scorer. Here: a demo lexicon and a MOCK MODEL. Neither output is a probability of any price move.</li>
<li><strong>Features.</strong> S1, S5, NVS and ABN summarise tone and volume per stock and day, using only articles available by that day's cutoff, then ranked across stocks.</li>
<li><strong>Label.</strong> The return from the next open to the open ten trading days later, divided by recent volatility (ATR). No equivalence with any close-to-close label is claimed.</li>
<li><strong>Frozen samples.</strong> The rows used for training and testing are fixed and hashed before any placebo is run, so every arm is compared on identical rows.</li>
<li><strong>Folds.</strong> Train on the past, test on 2021 and then 2022, leaving a gap so that no training label overlaps the test period.</li>
<li><strong>Statistics.</strong> Daily rank correlation (IC), a block bootstrap for uncertainty, Holm correction over three planned comparisons, and two placebos.</li>
<li><strong>Verdict.</strong> One function turns the fixed success rule into one fixed sentence. Rules were hashed before the run.</li></ol></div>
<div class="grid"><div class="card"><h2>Limitations</h2><ul>
<li>All prices and headlines are invented. Nothing here is evidence about markets.</li>
<li>The scorers are circular on this data: headlines are built from the demo word list.</li>
<li>Thirty tickers and about 480 test days: uncertainty is large, and the baseline itself is unstable between seeds.</li>
<li>Ten seeds give a coarse rate (steps of 10%).</li>
<li>No transaction-cost model beyond a flat 0.004; no liquidity, borrow or capacity.</li>
<li>FinBERT and Loughran-McDonald adapters have never been run on real inputs here.</li>
<li>The 2023 and synthetic calendars are illustrative, not exchange calendars.</li></ul></div>
<div class="card"><h2>Why a "not detected" result is acceptable</h2>
<p>The purpose is an honest instrument, not a positive result. If the planted link is not flagged, or a placebo also looks good, that is reported as produced: it tells us how much data or how strong a link this design needs. Changing seeds, thresholds or the planted strength after seeing results would defeat the check, so they are frozen.</p>
<h3>What cannot be claimed</h3><ul><li>That sentiment helps rank real stocks.</li><li>That any scorer here measures real tone.</li><li>That results would carry over to real data.</li></ul></div></div>`;
}

async function render(){

  on("scorer","change",e=>{state.scorer=e.target.value;re("scorer")();});
  on("flt","change",e=>{state.filter=e.target.value;re("flt")();});
  on("fdate","change",e=>{state.date=e.target.value;re("fdate")();});
  on("prev","click",()=>{state.offset=Math.max(0,state.offset-40);re("prev")();});
  on("next","click",()=>{state.offset+=40;re("next")();});
  on("go","click",async()=>{
    const q=`ts=${encodeURIComponent($("ts").value.trim())}&market=${$("mkt").value}&precision=${$("prec").value}`;
    try{state.assign=await get("/tools/assign-day?"+q);}catch(e){state.assign={error:e.message,input:$("ts").value,market:$("mkt").value,precision:$("prec").value};}

});
